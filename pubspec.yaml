name: scrollit
description: "A lightweight, privacy-first teleprompter app for creators."
publish_to: 'none'
version: 1.6.0+25

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  web: ^1.1.1
  firebase_core: ^3.13.0
  firebase_analytics: ^11.6.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
